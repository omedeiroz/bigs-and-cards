<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>Bigs & Cards — Protótipo</title>
  <link rel="stylesheet" href="tokens.css">
  <!-- React + Babel pinned -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

  <!-- mock data -->
  <script src="src/data.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- shared components -->
  <script type="text/babel" src="src/components/icons.jsx"></script>
  <script type="text/babel" src="src/components/cards.jsx"></script>
  <script type="text/babel" src="src/components/card-detail.jsx"></script>

  <!-- screens (each registers itself in window.SCREEN_COMPONENTS) -->
  <script type="text/babel" src="src/screens/auth.jsx"></script>
  <script type="text/babel" src="src/screens/home.jsx"></script>
  <script type="text/babel" src="src/screens/roster.jsx"></script>
  <script type="text/babel" src="src/screens/card-detail-screen.jsx"></script>
  <script type="text/babel" src="src/screens/friends.jsx"></script>
  <script type="text/babel" src="src/screens/challenges.jsx"></script>
  <script type="text/babel" src="src/screens/lobby.jsx"></script>
  <script type="text/babel" src="src/screens/match.jsx"></script>
  <script type="text/babel" src="src/screens/end.jsx"></script>
  <script type="text/babel" src="src/screens/profile.jsx"></script>

  <!-- app shell + mount -->
  <script type="text/babel" src="src/app.jsx"></script>
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<window.App />);
  </script>
</body>
</html>
